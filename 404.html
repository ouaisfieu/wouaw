<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon franchi — wouaw.</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#030305">
<link rel="icon" href="/wouaw/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/wouaw/wouaw.css">
<style>
  .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; overflow: hidden; }
  .bh { position: relative; width: min(86vw, 30rem); height: min(40vw, 13rem); margin: 0 auto 1.5rem; }
  .bh::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(closest-side, #000 30%, #ffd166 34%, #ff5fa2 52%, rgb(177 140 255 / .35) 74%, transparent 100%); filter: blur(2px); animation: glow 9s ease-in-out infinite alternate; }
  .bh::after { content: ""; position: absolute; left: 50%; top: 50%; width: min(24vw, 8rem); aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); background: #000; box-shadow: 0 0 0 2px rgb(255 209 102 / .55), 0 0 50px 10px rgb(255 95 162 / .3); }
  @keyframes glow { to { filter: blur(2px) hue-rotate(35deg) brightness(1.15); } }
  @media (prefers-reduced-motion: reduce) { .bh::before { animation: none; } }
  .lost > div { max-width: 34rem; }
  .lost h1 { font-size: clamp(2.2rem, 1.4rem + 4vw, 4rem); letter-spacing: -.05em; line-height: 1; margin: .4rem 0 1rem; }
  .lost p { color: var(--ink-2); }
</style>
</head>
<body>
<main class="lost">
  <div>
    <div class="bh" aria-hidden="true"></div>
    <p class="k">erreur 404</p>
    <h1>Cette page a franchi l’horizon.</h1>
    <p>Rien ne ressort d’un trou noir — sauf, très lentement, un peu de rayonnement de Hawking. Il faudrait attendre environ 10<sup>67</sup> ans. Plus court&#8239;: <a href="/wouaw/">revenir aux sept merveilles</a>.</p>
  </div>
</main>
</body>
</html>
